[platformio]
default_envs = esp32c3

; Chỉ hỗ trợ ESP32-C3 (GPIO0-5 là RTC pin, wake deep sleep được; sleep ~5µA)
[env:esp32c3]
platform = espressif32@^6.5.0
framework = arduino
board = esp32-c3-devkitm-1
monitor_speed = 115200
build_flags = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps = h2zero/NimBLE-Arduino@^1.4.2

; Bản thử trên bàn (chưa hàn nút): không deep sleep, luôn ở chế độ ghép đôi. Nạp: pio run -e bench -t upload
[env:bench]
extends = env:esp32c3
build_flags = ${env:esp32c3.build_flags} -DBENCH_TEST

; Thử các appearance khác nhau cho Kindle (đều là bản bench, không ngủ)
[env:bench_remote]
extends = env:bench
build_flags = ${env:bench.build_flags} -DBLE_APPEARANCE=0x0180

[env:bench_kbd]
extends = env:bench
build_flags = ${env:bench.build_flags} -DBLE_APPEARANCE=0x03C1

; Tự gửi PageDown/PageUp/Bright+/Bright- mỗi 5 giây khi đã kết nối (thử trước khi hàn nút)
[env:bench_auto]
extends = env:bench
build_flags = ${env:bench.build_flags} -DBENCH_AUTO
